<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AH TRADING - Admin Console</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-color: #0b0e16; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .admin-box { background: #1c212e; border: 1px solid #2a2e3d; border-radius: 12px; width: 100%; max-width: 500px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-tabs { display: flex; border-bottom: 1px solid #2a2e3d; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: none; border: none; color: #787b86; padding: 12px; font-weight: bold; cursor: pointer; font-size: 14px; text-transform: uppercase; }
        .tab-btn.active { color: #00b0ff; border-bottom: 2px solid #00b0ff; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 11px; color: #787b86; margin-bottom: 5px; text-transform: uppercase; }
        .form-input { width: 100%; background: #151924; border: 1px solid #333; border-radius: 6px; padding: 12px; color: white; outline: none; }
        
        .admin-scroll { max-height: 350px; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
        .admin-field { background: #151924; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .admin-field label { font-size: 10px; color: #00b0ff; font-weight: bold; display: flex; justify-content: space-between; }
        .admin-field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 14px; margin-top: 5px; outline: none; }
        
        .submit-btn { width: 100%; background: #00b0ff; border: none; border-radius: 6px; padding: 14px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .submit-btn:hover { filter: brightness(1.1); }
        
        .user-select-list { margin-bottom: 15px; background: #151924; border: 1px solid #333; color: white; width: 100%; padding: 12px; border-radius: 6px; outline: none; font-size: 14px; }
        #adminMainConsole { display: none; width: 100%; }
        
        /* Live Price Styling */
        .live-price-tag { font-weight: bold; color: #00e676; font-size: 10px; }
    </style>
</head>
<body>

<div class="admin-box" id="adminLoginBox">
    <h3 style="text-align: center; margin-bottom: 20px; color: #00b0ff; letter-spacing: 1px;">AH TRADING ADMIN LOGIN</h3>
    <div class="form-group"><label>Username</label><input type="text" id="admUser" class="form-input" placeholder="Admin ID"></div>
    <div class="form-group"><label>Password</label><input type="password" id="admPass" class="form-input" placeholder="••••••••"></div>
    <button class="submit-btn" onclick="verifyAdmin()">LOGIN TO CONSOLE</button>
</div>

<div class="admin-box" id="adminMainConsole">
    <div class="modal-tabs">
        <button class="tab-btn active" id="adminPanelEditorTab" onclick="switchAdminTab('editor')">GLOBAL SETTINGS</button>
        <button class="tab-btn" id="adminPanelUsersTab" onclick="switchAdminTab('users')">MANAGE USERS</button>
    </div>

    <div id="adminEditorSection">
        <h3 style="text-align: center; margin-bottom: 15px; color: #00e676;">GLOBAL CONTROL</h3>
        <div class="admin-scroll">
            
            <div style="background: rgba(255,145,0,0.1); border: 1px solid #ff9100; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <p style="font-size: 11px; color:#ff9100; font-weight:bold; margin-bottom:8px; text-transform:uppercase;">🔥 Auto-Win Trick Windows Timer</p>
                <div class="admin-field" style="margin-bottom:8px;"><label>INVESTMENT MAX LIMIT (PKR)</label><input type="number" id="hackLimitAmt" placeholder="e.g. 500 (Isse niche lagane wale win honge)"></div>
                <div class="admin-field" style="margin-bottom:8px;"><label>TIMER duration (MINUTES)</label><input type="number" id="hackDurationMin" placeholder="e.g. 15 (Kitni der active rahe)"></div>
                <div id="activeHackStatus" style="font-size:10px; color:#787b86; padding:4px 0;">Status: No Active Timer</div>
                <button class="submit-btn" style="background:#ff9100; padding:8px; font-size:11px; margin-top:5px;" onclick="startWinWindowHack()">ACTIVATE WIN TIMER WINDOW</button>
            </div>
            
            <div class="admin-field" style="border: 1px solid #ff3d00;"><label>REQUIRED WINS FOR WITHDRAWAL (LIMIT)</label><input type="number" id="editMinWins" placeholder="e.g. 50"></div>
            <div class="admin-field" style="border: 1px solid #00b0ff;"><label>CURRENT ACTIVE PROMO CODE</label><input type="text" id="editPromo"></div>
            <hr style="border:0; border-top:1px solid #2a2e3d; margin:15px 0;">
            <p style="font-size: 11px; color:#787b86; margin-bottom:10px; font-weight: bold;">CRYPTO ASSETS BASE PRICES</p>
            <div id="cryptoListInputs"></div>
        </div>
        <button class="submit-btn" style="background:#00e676" onclick="applyGlobalChanges()">SAVE GLOBAL SETTINGS</button>
    </div>

    <div id="adminUsersSection" style="display: none;">
        <h3 style="text-align: center; margin-bottom: 15px; color: #00b0ff;">USER ACCOUNT MANAGER</h3>
        <label style="font-size: 11px; color: #787b86; display: block; margin-bottom: 5px;">SELECT REGISTERED USER</label>
        <select id="adminUserSelector" class="user-select-list" onchange="loadSelectedUserData()">
            <option value="">-- Select a User --</option>
        </select>
        
        <div id="adminUserDataFields" style="display: none;" class="admin-scroll">
            <div class="admin-field"><label>USER BALANCE (PKR)</label><input type="number" id="userEditBal"></div>
            <div class="admin-field"><label>USER LEVEL</label><input type="number" id="userEditLvl"></div>
            <div class="admin-field"><label>USER XP</label><input type="number" id="userEditXP"></div>
            <div class="admin-field"><label>USER TOTAL WINS</label><input type="number" id="userEditWins"></div>
            <div class="admin-field" style="border: 1px solid #ff9100;"><label>WITHDRAW TARGET PROGRESS (CURRENT WINS)</label><input type="number" id="userEditTargetProgress"></div>
        </div>
        <button id="userSaveBtn" class="submit-btn" style="background:#00b0ff; display: none;" onclick="applyUserChanges()">SAVE USER DATA</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8FuGJ54Yv0TdauGmTADYPEQjlqCQSAz8",
        databaseURL: "https://ah-trading-98e6a-default-rtdb.firebaseio.com",
        projectId: "ah-trading-98e6a",
        storageBucket: "ah-trading-98e6a.firebasestorage.app",
        appId: "1:617012552850:android:3e1425677ad3d6c231324b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const cryptoAssets = [
        { name: "BTC / USD", val: "BTC", base: "80018.8" },
        { name: "ETH / USD", val: "ETH", base: "2061.65" },
        { name: "SOL / USD", val: "SOL", base: "83.64" },
        { name: "BNB / USD", val: "BNB", base: "653.2" },
        { name: "OKB / USD", val: "OKB", base: "89.03" },
        { name: "XRP / USD", val: "XRP", base: "1.3239" },
        { name: "TON / USD", val: "TON", base: "1.873" },
        { name: "PI / USD", val: "PI", base: "0.1423" }
    ];

    function verifyAdmin() {
        const u = document.getElementById('admUser').value;
        const p = document.getElementById('admPass').value;
        if(u === 'admin' && p === '@dmin1234') {
            document.getElementById('adminLoginBox').style.display = 'none';
            document.getElementById('adminMainConsole').style.display = 'block';
            initConsole();
        } else { alert("Wrong Password!"); }
    }

    async function initConsole() {
        const snapLimit = await db.ref('settings/min_wins_limit').get();
        document.getElementById('editMinWins').value = snapLimit.exists() ? snapLimit.val() : 50;

        const snapPromo = await db.ref('settings/current_promo').get();
        document.getElementById('editPromo').value = snapPromo.exists() ? snapPromo.val() : "AH9900";

        // Listen for active hack countdown sync
        db.ref('settings/win_window_hack').on('value', snap => {
            const statusDiv = document.getElementById('activeHackStatus');
            if(snap.exists()) {
                const data = snap.val();
                const now = new Date().getTime();
                if(now < data.expiry) {
                    const remainingSec = Math.round((data.expiry - now) / 1000);
                    statusDiv.innerHTML = `<span style="color:#00e676; font-weight:bold;">ACTIVE</span> - Limit: Rs ${data.limit} | Remaining: ${Math.floor(remainingSec/60)}m ${remainingSec%60}s`;
                } else {
                    statusDiv.innerHTML = "Status: Expired / Passive";
                }
            }
        });

        const list = document.getElementById('cryptoListInputs');
        list.innerHTML = '';
        const snapBases = await db.ref('settings/crypto_bases').get();
        const serverBases = snapBases.exists() ? snapBases.val() : {};

        cryptoAssets.forEach(asset => {
            const currentBaseVal = serverBases[asset.val] || asset.base;
            list.innerHTML += `
                <div class="admin-field">
                    <label>
                        <span>${asset.name} Base Value</span>
                        <span class="live-price-tag" id="live-${asset.val}">Live: Loading...</span>
                    </label>
                    <input type="number" class="adm-crypto-input" data-symbol="${asset.val}" value="${currentBaseVal}" step="0.0001">
                </div>`;
        });

        fetchAllUsersList();
        
        // Start Binance real-time updates
        fetchBinancePrices();
        setInterval(fetchBinancePrices, 5000); // Har 5 seconds me price refresh hogi

        setInterval(refreshConsoleHackStatusLabel, 1000); // Live countdown clock inside admin view
    }

    // Binance API Fetch Logic
    async function fetchBinancePrices() {
        try {
            const response = await fetch('https://api.binance.com/api/v3/ticker/price');
            if (!response.ok) return;
            const data = await response.json();
            
            // Tickers mapping array ko object dictionary me convert kiya complex loops se bachne k liye
            const prices = {};
            data.forEach(item => {
                prices[item.symbol] = parseFloat(item.price);
            });

            cryptoAssets.forEach(asset => {
                const liveEl = document.getElementById(`live-${asset.val}`);
                if (!liveEl) return;

                const binanceTicker = asset.val + "USDT";
                if (prices[binanceTicker]) {
                    const priceVal = prices[binanceTicker];
                    // Formatting dynamic decimal positions base on size
                    const formattedPrice = priceVal > 1 ? priceVal.toFixed(2) : priceVal.toFixed(4);
                    liveEl.innerText = `Live: $${formattedPrice}`;
                    liveEl.style.color = "#00e676";
                } else {
                    liveEl.innerText = `Live: N/A`;
                    liveEl.style.color = "#ff3d00";
                }
            });
        } catch (e) {
            console.error("Binance API error: ", e);
        }
    }

    // Function to calculate execution data updates live
    async function refreshConsoleHackStatusLabel() {
        const snap = await db.ref('settings/win_window_hack').get();
        const statusDiv = document.getElementById('activeHackStatus');
        if(snap.exists()) {
            const data = snap.val();
            const now = new Date().getTime();
            if(now < data.expiry) {
                const remainingSec = Math.round((data.expiry - now) / 1000);
                statusDiv.innerHTML = `<span style="color:#00e676; font-weight:bold;">ACTIVE</span> - Limit: Rs ${data.limit} | Remaining: ${Math.floor(remainingSec/60)}m ${remainingSec%60}s`;
            } else {
                statusDiv.innerHTML = "Status: Expired / Passive";
            }
        }
    }

    async function startWinWindowHack() {
        const limit = parseFloat(document.getElementById('hackLimitAmt').value);
        const mins = parseInt(document.getElementById('hackDurationMin').value);

        if(isNaN(limit) || isNaN(mins) || limit <= 0 || mins <= 0) {
            alert("Please enter valid positive numbers!");
            return;
        }

        const now = new Date().getTime();
        const expiryTime = now + (mins * 60 * 1000);

        await db.ref('settings/win_window_hack').set({
            limit: limit,
            expiry: expiryTime
        });

        alert(`Win window hack configured! For the next ${mins} minutes, anyone investing below Rs ${limit} will instantly win.`);
    }

    function switchAdminTab(tab) {
        if(tab === 'editor') {
            document.getElementById('adminPanelEditorTab').className = 'tab-btn active';
            document.getElementById('adminPanelUsersTab').className = 'tab-btn';
            document.getElementById('adminEditorSection').style.display = 'block';
            document.getElementById('adminUsersSection').style.display = 'none';
        } else {
            document.getElementById('adminPanelEditorTab').className = 'tab-btn';
            document.getElementById('adminPanelUsersTab').className = 'tab-btn active';
            document.getElementById('adminEditorSection').style.display = 'none';
            document.getElementById('adminUsersSection').style.display = 'block';
        }
    }

    async function applyGlobalChanges() {
        const minWins = parseInt(document.getElementById('editMinWins').value) || 0;
        const promo = document.getElementById('editPromo').value.toUpperCase().trim();

        await db.ref('settings/min_wins_limit').set(minWins);
        await db.ref('settings/current_promo').set(promo);

        const inputs = document.querySelectorAll('.adm-crypto-input');
        let cryptoBases = {};
        inputs.forEach(input => {
            const symbol = input.getAttribute('data-symbol');
            cryptoBases[symbol] = parseFloat(input.value);
        });
        await db.ref('settings/crypto_bases').set(cryptoBases);

        alert("Global Settings Saved and Synced successfully!");
    }

    let allUsersDataCache = {};
    async function fetchAllUsersList() {
        const selector = document.getElementById('adminUserSelector');
        selector.innerHTML = '<option value="">-- Select a User --</option>';
        document.getElementById('adminUserDataFields').style.display = 'none';
        document.getElementById('userSaveBtn').style.display = 'none';

        try {
            const snap = await db.ref('users').get();
            if(snap.exists()) {
                allUsersDataCache = snap.val();
                Object.keys(allUsersDataCache).forEach(username => {
                    selector.innerHTML += `<option value="${username}">${username}</option>`;
                });
            }
        } catch(e) { console.error("Error fetching users list: ", e); }
    }

    function loadSelectedUserData() {
        const selectedUser = document.getElementById('adminUserSelector').value;
        const fieldsDiv = document.getElementById('adminUserDataFields');
        const saveBtn = document.getElementById('userSaveBtn');

        if(!selectedUser || !allUsersDataCache[selectedUser]) {
            fieldsDiv.style.display = 'none';
            saveBtn.style.display = 'none';
            return;
        }

        const uData = allUsersDataCache[selectedUser];
        document.getElementById('userEditBal').value = uData.balance || 0;
        document.getElementById('userEditLvl').value = uData.level || 1;
        document.getElementById('userEditXP').value = uData.xp || 0;
        document.getElementById('userEditWins').value = uData.wins || 0;
        document.getElementById('userEditTargetProgress').value = uData.withdrawTargetProgress || 0;

        fieldsDiv.style.display = 'block';
        saveBtn.style.display = 'block';
    }

    async function applyUserChanges() {
        const selectedUser = document.getElementById('adminUserSelector').value;
        if(!selectedUser) return;

        const uBal = parseFloat(document.getElementById('userEditBal').value) || 0;
        const uLvl = parseInt(document.getElementById('userEditLvl').value) || 1;
        const uXP = parseInt(document.getElementById('userEditXP').value) || 0;
        const uWins = parseInt(document.getElementById('userEditWins').value) || 0;
        const uTarget = parseInt(document.getElementById('userEditTargetProgress').value) || 0;

        try {
            await db.ref('users/' + selectedUser).update({
                balance: uBal,
                level: uLvl,
                xp: uXP,
                wins: uWins,
                withdrawTargetProgress: uTarget
            });
            
            alert(`User "${selectedUser}" data updated successfully!`);
            fetchAllUsersList(); 
        } catch(e) { alert("Failed to update user data."); }
    }
</script>
</body>
</html>
